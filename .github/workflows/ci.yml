name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      # threads (vite.config.js's default, chosen because forks hangs in the
      # sandboxed local dev environment this repo is usually worked in) fails
      # outright on GitHub Actions runners - forks is the one that works here.
      - run: npm test -- --pool=forks
      - run: npm run build
